<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://gc.zgo.at; style-src 'unsafe-inline'; img-src data: https://*.goatcounter.com; connect-src https://*.goatcounter.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Review Assistant – Divine Photo Studio</title>
<style>
:root{--navy:#2D4560;--gold:#B8923F;--ivory:#FBF7EF;--card:#fff;--ink:#2B2B2B;--mute:#6B7280;--line:#E6DFD0}
*{box-sizing:border-box}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Gujarati","Noto Sans Devanagari",sans-serif;line-height:1.5}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px 32px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-bottom:max(32px,env(safe-area-inset-bottom))}
button,input,a.btn{-webkit-appearance:none;appearance:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;font-family:inherit}
.logo{display:block;margin:0 auto 10px;width:230px;max-width:70%;height:auto}
.back{background:none;border:0;color:var(--navy);font-size:15px;min-height:44px;padding:0 4px;cursor:pointer;margin:-8px 0 6px}
.other{display:block;width:100%;min-height:48px;margin-top:10px;padding:0 14px;border:1.5px solid var(--navy);border-radius:14px;font-size:16px;color:var(--ink);background:#fff}
.thanks{text-align:center;color:var(--navy);font-weight:600;margin-top:12px}
.lang{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.lang button{min-height:40px;padding:0 14px;border:1px solid var(--line);background:#fff;border-radius:20px;font-size:14px;color:var(--navy);cursor:pointer}
.lang button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
header{text-align:center;margin-bottom:18px}
h1{font-family:Georgia,"Noto Serif Gujarati","Noto Serif Devanagari",serif;color:var(--navy);font-size:26px;margin:0}
.tag{color:var(--gold);font-size:14px;margin:4px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 16px;box-shadow:0 2px 12px rgba(45,69,96,.06)}
h2{font-family:Georgia,"Noto Serif Gujarati","Noto Serif Devanagari",serif;color:var(--navy);font-size:21px;margin:0 0 14px;text-align:center}
h3{font-size:16px;color:var(--navy);margin:18px 0 10px}
.stars{display:flex;justify-content:center;gap:4px}
.stars button{background:none;border:0;font-size:46px;line-height:1;min-width:56px;min-height:56px;color:#D9D2C0;cursor:pointer}
.stars button.on{color:var(--gold)}
.lbl{text-align:center;min-height:24px;color:var(--navy);font-weight:600;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:8px 16px;border:1.5px solid var(--line);background:#fff;border-radius:24px;font-size:15px;color:var(--ink);cursor:pointer;text-align:left}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip:disabled{opacity:.45}
.btn{display:block;width:100%;min-height:52px;border:0;border-radius:14px;background:var(--navy);color:#fff;font-size:17px;font-weight:600;cursor:pointer;margin-top:12px;text-align:center;text-decoration:none;line-height:52px;padding:0}
.btn.alt{background:#fff;color:var(--navy);border:1.5px solid var(--navy);line-height:49px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.review{-webkit-user-select:text;user-select:text;background:var(--ivory);border:1px dashed var(--gold);border-radius:14px;padding:16px;font-size:16px;white-space:pre-wrap}
textarea.review{display:block;width:100%;min-height:160px;resize:vertical;font:inherit;font-size:16px;line-height:1.5;color:var(--ink)}
.editHint{text-align:center;margin:8px 0 0}
.note{font-size:14px;color:var(--mute);margin-top:12px;text-align:center}
.hint{font-size:13px;color:var(--mute);margin:-4px 0 10px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 22px;border-radius:24px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
footer{margin-top:auto;padding-top:22px;text-align:center;font-size:12px;color:var(--mute)}
.hidden{display:none}
</style>
</head>

  like:{photo:["દરેક ફોટો સ્પષ્ટ અને સરસ રીતે લેવાયો છે."],video:["વિડિયો જોઈને બધી યાદો તાજી થઈ ગઈ."],candid:["નાની નાની પળો પણ તેમણે સરસ રીતે ઝડપી."],edit:["અંતિમ કલર અને ફિનિશિંગ ખૂબ સરસ લાગ્યા."],team:["ટીમ માનપૂર્વક વર્તી અને સાથે કામ કરવું સહેલું રહ્યું."],punct:["ટીમના કારણે બધું સમયપત્રક મુજબ ચાલ્યું."],deliv:["ફાઇલો માટે લાંબી રાહ જોવી પડી નહીં."],album:["આલ્બમ સુંદર લાગે છે અને સરસ બનેલો છે."],value:["કામના પ્રમાણમાં કિંમત યોગ્ય લાગી."]},
  close:{hi:["અમારી યાદોને આટલી સરસ રીતે કેદ કરવા બદલ આભાર."],ok:["તમારી મહેનત બદલ આભાર."],mid:["મહેનતની કદર છે, આગલી વખતે વધુ સુધારાની આશા."],lo:["આશા છે કે અમારો પ્રતિભાવ ઉપયોગી થશે."]}},
 hi:{open:{hi:["{o} के लिए Divine Photo Studio को चुनने का फैसला बहुत सही रहा।"],ok:["{o} के लिए Divine Photo Studio का काम हमें पसंद आया।"],mid:["{o} के लिए Divine Photo Studio का अनुभव मध्यम रहा।"],lo:["{o} के लिए Divine Photo Studio से हमें और उम्मीद थी।"]},
  like:{photo:["हर फोटो साफ़ और अच्छी तरह खींची गई है।"],video:["वीडियो देखकर सारी यादें ताज़ा हो गईं।"],candid:["छोटे-छोटे पल भी उन्होंने बखूबी पकड़े।"],edit:["फाइनल कलर और फिनिशिंग बहुत अच्छी लगी।"],team:["टीम ने सम्मान से व्यवहार किया और साथ काम करना आसान रहा।"],punct:["टीम की वजह से सब कुछ समय पर चला।"],deliv:["फाइलों के लिए लंबा इंतज़ार नहीं करना पड़ा।"],album:["एल्बम सुंदर लगता है और अच्छा बना है।"],value:["काम के हिसाब से कीमत सही लगी।"]},
  close:{hi:["हमारी यादों को इतने अच्छे से कैद करने के लिए धन्यवाद।"],ok:["आपकी मेहनत के लिए धन्यवाद।"],mid:["मेहनत की कद्र है, अगली बार और सुधार की उम्मीद।"],lo:["उम्मीद है हमारी राय काम आएगी।"]}}};
for(const L in EXTRA)for(const part in EXTRA[L])for(const k in EXTRA[L][part])PH[L][part][k].push(...EXTRA[L][part][k]);

// ===== STATE =====
const S={lang:CONFIG.defaultLanguage,rating:0,occs:[],other:"",likes:[],text:"",last:{}};
const $=id=>document.getElementById(id);
const show=id=>{["s1","s2","s3a","s3b"].forEach(s=>$(s).classList.toggle("hidden",s!==id));window.scrollTo(0,0)};
const tone=r=>r==5?"hi":r==4?"ok":r==3?"mid":"lo";
const pick=(arr,key)=>{let i;do{i=Math.floor(Math.random()*arr.length)}while(arr.length>1&&S.last[key]===i);S.last[key]=i;return arr[i]};
const lc=s=>S.lang==="en"?s.charAt(0).toLowerCase()+s.slice(1):s;

function makeReview(){
  const P=PH[S.lang],t=tone(S.rating),os=OCC_KEYS.filter(k=>S.occs.includes(k)).map(k=>{const t=P.occ[OCC_KEYS.indexOf(k)],c=k==="other"?S.other.replace(/[<>]/g,"").trim().slice(0,40):"";return c?({en:"our ",gu:"અમારા ",hi:"हमारे "}[S.lang])+c:t}),AND={en:" and ",gu:" અને ",hi:" और "}[S.lang],o=os.length>1?os.slice(0,-1).join(", ")+AND+os[os.length-1]:os[0];
  const parts=[pick(P.open[t],"open").replace("{o}",o)];
  [...S.likes].sort(()=>Math.random()-.5).forEach((k,i)=>{let p=pick(P.like[k],k);if(i===0&&P.lead[t])p=P.lead[t]+lc(p);parts.push(p)});
  parts.push(pick(P.close[t],"close"));
  S.text=parts.join(" ");
  if(S.rating>=4)$("rev").value=S.text;else $("fb").value=S.text;
}

function render(){
  const u=UI[S.lang],L=LABELS[S.lang];
  document.documentElement.lang=S.lang;
  $("biz").textContent=CONFIG.businessName;$("tagline").textContent=u.tag;
  $("q1").textContent=u.q1;$("qOcc").textContent=u.qOcc;$("qLike").textContent=u.qLike;$("hintLike").textContent=u.hint;
  $("gen").textContent=u.gen;$("t3a").textContent=u.t3a;$("again").textContent=u.again;$("again2").textContent=u.again;
  $("post").textContent=u.post;document.querySelectorAll(".editHint").forEach(e=>e.textContent=u.edit);["back1","back2","back3"].forEach(i=>$(i).textContent=u.back);$("otherTxt").placeholder=u.other;$("call").textContent=u.call;$("call").href="tel:"+CONFIG.callNumber;$("postHint").textContent=u.hint2;$("t3b").textContent=u.t3b;$("wa").textContent=u.wa;$("priv").textContent=u.priv;
  $("lang").innerHTML="";
  [["gu","ગુજરાતી"],["en","English"],["hi","हिन्दी"]].forEach(([c,n])=>{const b=document.createElement("button");b.textContent=n;b.className=c===S.lang?"on":"";b.onclick=()=>{S.lang=c;S.last={};render();if(!$("s3a").classList.contains("hidden")||!$("s3b").classList.contains("hidden"))makeReview()};$("lang").appendChild(b)});
  $("stars").innerHTML="";
  for(let i=1;i<=5;i++){const b=document.createElement("button");b.textContent="★";b.setAttribute("aria-label",i+" - "+u.stars[i-1]);b.className=i<=S.rating?"on":"";
    b.onmouseenter=()=>{$("starLbl").textContent=u.stars[i-1]};b.onclick=()=>{S.rating=i;render();$("starLbl").textContent=u.stars[i-1];setTimeout(()=>show("s2"),350)};$("stars").appendChild(b)}
  if(S.rating)$("starLbl").textContent=u.stars[S.rating-1];
  $("occ").innerHTML="";
  OCC_KEYS.forEach((k,i)=>{const b=document.createElement("button");const onO=S.occs.includes(k);b.className="chip"+(onO?" on":"");b.textContent=L.occ[i];b.onclick=()=>{S.occs=onO?S.occs.filter(x=>x!==k):[...S.occs,k];render();if(k==="other"&&!onO)$("otherTxt").focus()};$("occ").appendChild(b)});
  $("like").innerHTML="";
  LIKE_KEYS.forEach((k,i)=>{const on=S.likes.includes(k),b=document.createElement("button");b.className="chip"+(on?" on":"");b.textContent=L.like[i];
    b.onclick=()=>{S.likes=on?S.likes.filter(x=>x!==k):[...S.likes,k];render()};$("like").appendChild(b)});
  $("otherTxt").classList.toggle("hidden",!S.occs.includes("other"));updGen();
}
function updGen(){$("gen").disabled=!(S.occs.length&&S.likes.length)}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800)}

$("gen").onclick=()=>{makeReview();$("thanks").classList.add("hidden");setWa();show(S.rating>=4?"s3a":"s3b")};
$("again").onclick=$("again2").onclick=()=>{makeReview();setWa();$("thanks").classList.add("hidden")};
$("rev").oninput=$("fb").oninput=e=>{S.text=e.target.value;setWa()};
$("otherTxt").oninput=e=>{S.other=e.target.value};
$("back1").onclick=()=>show("s1");$("back2").onclick=$("back3").onclick=()=>show("s2");
function copySync(){let ok=false;try{const t=document.createElement("textarea");t.value=S.text;t.setAttribute("readonly","");t.style.cssText="position:fixed;top:0;left:0;opacity:0;font-size:16px";document.body.appendChild(t);t.focus();t.select();t.setSelectionRange(0,t.value.length);ok=document.execCommand("copy");document.body.removeChild(t)}catch(e){}
  try{navigator.clipboard&&navigator.clipboard.writeText(S.text)}catch(e){}return ok}
const safe=u=>/^https:\/\//.test(u)&&!u.includes("PASTE");
const waOk=/^\d{10,15}$/.test(CONFIG.whatsappNumber);
function setWa(){$("wa").href=waOk?"https://wa.me/"+CONFIG.whatsappNumber+"?text="+encodeURIComponent(S.text):"#"}
function track(n){try{window.goatcounter&&window.goatcounter.count({path:n,title:n,event:true})}catch(e){}}
$("post").href=safe(CONFIG.googleReviewUrl)?CONFIG.googleReviewUrl:"#";
$("post").addEventListener("click",e=>{if(!safe(CONFIG.googleReviewUrl)){e.preventDefault();return toast(UI[S.lang].noCfg)}
  copySync();track("post-google");$("thanks").textContent=UI[S.lang].thanks;$("thanks").classList.remove("hidden");toast(UI[S.lang].pcopied)});
$("wa").addEventListener("click",e=>{if(!waOk){e.preventDefault();toast(UI[S.lang].noCfg)}else track("whatsapp-feedback")});
if(CONFIG.goatCounterUrl.startsWith("https://")){const g=document.createElement("script");g.async=true;g.src="https://gc.zgo.at/count.js";g.setAttribute("data-goatcounter",CONFIG.goatCounterUrl);document.head.appendChild(g)}
render();show("s1");
</script>
